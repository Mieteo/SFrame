<!DOCTYPE html>

                        "on-background": "#111c2d",

                    "spacing": {
                        "unit": "4px",
                        "margin": "20px",
                        "lg": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "sm": "8px",
                        "xl": "32px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],

                    "fontSize": {

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline-variant fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-margin py-sm w-full max-w-full mx-auto h-16">
<div class="flex items-center gap-sm text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="movie_edit">movie_edit</span>
<h1 class="text-headline-sm font-headline-sm font-bold">Snap Frame</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant">
<img alt="User profile avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC70EN2q6JaG3YMNqDRzywgCHN_dA7wXoYRadq76y0dKqnjPe-IT_dimzIli3RlBiSPhUo7kxCyaN_saqroHMRJexyHnb_DkqD1-tFbAFHG4R0Lm6KkuNKNPkTbPQRC7r76o758gn1-Ii38atIsupUAPZRHdOmhGD3O2e8Rc-nSz1vnMTpf0h-pzfqSQF5DLec8HtJxQqgMeiWl0M37BCHcgvDM74-5JXDPzEYTFcbhOfhoA3d3UMLKDdjd65D1BemaykIP7xXr7Dg"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-margin max-w-2xl mx-auto">
<div class="mb-xl">
<h2 class="text-headline-md font-headline-md text-on-surface">Cài đặt</h2>
</div>
<!-- Section: Cấu hình xuất -->
<section class="mb-xl">
<div class="flex items-center gap-sm mb-lg">
<span class="material-symbols-outlined text-primary" data-icon="settings_suggest">settings_suggest</span>
<h3 class="text-body-lg font-bold text-on-surface">Cấu hình xuất</h3>
</div>
<div class="space-y-lg">
<!-- FPS Item -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
<div class="flex flex-col gap-xs mb-md">
<label class="text-body-md font-bold text-on-surface" for="fps-select">Frames per second (fps)</label>
<p class="text-label-md font-label-md text-on-surface-variant">Số lượng ảnh được trích xuất mỗi giây</p>
</div>
<div class="relative">
<select class="w-full h-12 px-md appearance-none bg-surface-container border border-outline-variant rounded-lg text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" id="fps-select">
<option value="all">Tất cả</option>
<option value="30">30</option>
<option value="25">25</option>
<option value="24">24</option>
<option value="15">15</option>
</select>
<div class="absolute right-md top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Format Item -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
<div class="flex flex-col gap-xs mb-md">
<label class="text-body-md font-bold text-on-surface">Định dạng ảnh đầu ra</label>
</div>
<div class="grid grid-cols-2 gap-md">
<label class="relative flex items-center justify-center h-12 cursor-pointer group">
<input checked="" class="peer sr-only" name="format" type="radio" value="png"/>
<div class="w-full h-full flex items-center justify-center rounded-lg border border-outline-variant bg-surface-container text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary transition-all">
                                PNG
                            </div>
</label>
<label class="relative flex items-center justify-center h-12 cursor-pointer group">
<input class="peer sr-only" name="format" type="radio" value="jpg"/>
<div class="w-full h-full flex items-center justify-center rounded-lg border border-outline-variant bg-surface-container text-body-md peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary transition-all">
                                JPG
                            </div>
</label>
</div>
</div>
</div>
</section>
<!-- Aesthetic Bento-ish Card for Info -->
<section class="grid grid-cols-1 gap-md">
<div class="bg-primary-container text-on-primary-container p-xl rounded-xl relative overflow-hidden">
<div class="relative z-10">
<h4 class="text-body-lg font-bold mb-sm">Chế độ chuyên nghiệp</h4>
<p class="text-body-md opacity-90 max-w-[80%]">Tối ưu hóa quy trình trích xuất khung hình từ video chất lượng cao với độ trễ thấp nhất.</p>
</div>
<span class="material-symbols-outlined absolute -bottom-4 -right-4 text-[120px] opacity-10" data-icon="speed">speed</span>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline-variant flex justify-around items-center px-md pb-lg pt-sm rounded-t-xl shadow-sm dark:shadow-none">
<!-- Main Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-highest transition-all" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-label-md font-label-md">Main</span>
</a>
<!-- Results Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-4 py-1 hover:bg-surface-container dark:hover:bg-surface-container-highest transition-all" href="#">
<span class="material-symbols-outlined" data-icon="video_library">video_library</span>
<span class="text-label-md font-label-md">Results</span>
</a>
<!-- Settings Tab (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-full px-4 py-1 scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="text-label-md font-label-md font-bold">Settings</span>
</a>
</nav>
</body></html>
